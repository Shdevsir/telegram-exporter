[project]
name = "telegram-exporter"
version = "0.1.0"
description = "A professional tool for exporting and analyzing Telegram chats"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "telethon==1.42.0",
    "python-dotenv==1.2.1",
    "rich==14.1.0",
    "pre-commit==4.5.1",
]

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"
line-length = 120

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
    "C901", # complex-structure
    "PLR0913" # to-many-arguments
]

[tool.ruff.lint.isort]
force-single-line = true
order-by-type = false

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
check_untyped_defs = true
